plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.marco.ptt'
    compileSdk 34
    defaultConfig {
        applicationId "com.marco.ptt"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "0.4"
    }
    // 固定签名：每次编译出的 APK 签名一致，才能直接覆盖安装
    signingConfigs {
        fixed {
            storeFile file('ptt.keystore')
            storePassword 'ptt123456'
            keyAlias 'ptt'
            keyPassword 'ptt123456'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
        release { minifyEnabled false; signingConfig signingConfigs.fixed }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
